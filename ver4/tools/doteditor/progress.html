<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>장수 도트 진행</title>
<style>
:root{color-scheme:dark;--bg:#101315;--panel:#191d20;--line:#2b3237;--muted:#89939b;--text:#e7ecef;--accent:#b5f078;--warn:#f0c674}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
button,select{font:inherit;color:inherit;background:#22282d;border:1px solid #384148;border-radius:6px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}button.active{color:var(--accent);border-color:#7eab50;background:#293525}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;background:#14181bf2;border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
h1{font-size:17px;margin:0 8px 0 0}label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.group{display:flex;gap:4px}.stat{display:flex;flex-direction:column;line-height:1.2}.stat small{color:var(--muted);font-size:11px}
.stat b{font:600 15px ui-monospace,monospace}
.bar{width:180px;max-width:40vw;height:8px;background:#22282d;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
#status{color:var(--muted);font-size:12px}#status.error{color:#ff9c9c}
main{padding:16px 20px 40px}
section.unit{margin-bottom:26px}section.unit>h2{font-size:16px;margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
section.unit>h2 span{color:var(--muted);font:12px monospace}
.anim{display:flex;gap:12px;align-items:flex-start;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;background:#14181b}
.anim.done{border-color:#4f6e33;border-left-color:var(--accent);background:#172014}
.anim.idle{opacity:.45}
.label{flex:0 0 96px;display:flex;flex-direction:column;gap:3px}.label strong{font-size:14px}
.label .count{font:13px ui-monospace,monospace;color:var(--muted)}.label .edit{font-size:11px;color:var(--warn)}
.badge{align-self:flex-start;font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid #384148;color:var(--muted)}
.done .badge{color:#101315;background:var(--accent);border-color:var(--accent);font-weight:600}
.work .badge{color:var(--warn);border-color:#6d5a30}
.row{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
figcaption{font:11px monospace;color:var(--muted)}canvas{image-rendering:pixelated;display:block;max-width:100%}
@media (max-width:640px){header{padding:10px 16px}main{padding:12px 16px 32px}.anim{flex-direction:column;gap:6px}
  .label{flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 10px}.bar{width:120px}}
</style>
</head>
<body>
<header>
<h1>장수 도트 진행</h1>
<div class="stat"><small>경과</small><b id="elapsed">–</b></div>
<div class="stat"><small>바뀐 프레임</small><b id="count">–</b><div class="bar"><i id="bar"></i></div></div>
<div class="stat"><small>남은 시간(검수 포함)</small><b id="eta">–</b></div>
<div class="stat"><small>마지막 갱신</small><b id="updated">–</b></div>
<div class="group"><button id="play">Ⅱ 정지</button></div>
<div class="group" id="speeds"><button data-speed="1" class="active">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button><button data-speed="8">×8</button></div>
<label>확대 <select id="zoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>×</label>
<span id="status">불러오는 중…</span>
</header>
<main id="units"></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const NAMES={idle:'대기',walk:'이동',attack:'공격',hit:'피격',exhausted:'탈진',block:'막기',action:'액션'};
const DIRS=['N','NE','E','SE','S','SW','W','NW'],HOLD=500,BG='#3c3c3c';
let data=null,images={},states={},playing=true,speed=1,last=performance.now();
const status=(m,e=false)=>{$('status').textContent=m;$('status').classList.toggle('error',e);};
const clock=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};
const hm=t=>new Date(t*1000).toTimeString().slice(0,8);
const ago=s=>s<60?Math.floor(s)+'초 전':Math.floor(s/60)+'분 전';

function loadImages(d){
  const next={},jobs=[];
  for(const u of Object.values(d.units))for(const a of Object.values(u.anims)){
    const im=new Image();im.src='heroes/live/'+a.image+'?v='+d.updated;next[a.image]=im;
    jobs.push(im.decode().catch(()=>{}));}
  return Promise.all(jobs).then(()=>{images=next;});
}

function layout(){
  const keep=states;states={};
  $('units').replaceChildren(...Object.entries(data.units).map(([id,u])=>{
    const s=document.createElement('section');s.className='unit';
    const anims=Object.values(u.anims),ch=anims.reduce((n,a)=>n+a.changed,0),tot=anims.reduce((n,a)=>n+a.total,0);
    s.innerHTML=`<h2>${u.name}${id.endsWith('_noncombat')?' 비전투':''}<span>${id} · ${ch}/${tot}${u.reviews.length?' · '+u.reviews.join(', '):''}</span></h2>`;
    const dirs=DIRS.filter(d=>u.rows.includes(d));
    for(const [name,a] of Object.entries(u.anims)){
      const key=id+'/'+name;states[key]=keep[key]||{frame:0,elapsed:0};
      const kind=a.done?'done':a.changed||a.editing?'work':'idle';
      const box=document.createElement('div');box.className='anim '+kind;
      box.innerHTML=`<div class="label"><strong>${NAMES[name]||name}</strong><span class="count">${a.changed}/${a.total}</span>`+
        `<span class="badge">${{done:'완료',work:'진행 중',idle:'대기'}[kind]}</span>${a.editing?`<span class="edit">편집 중 ${a.editing}</span>`:''}</div>`;
      const row=document.createElement('div');row.className='row';
      row.append(...dirs.map(d=>{const fig=document.createElement('figure'),c=document.createElement('canvas');
        Object.assign(c.dataset,{unit:id,anim:name,dir:d});fig.append(c,document.createElement('figcaption'));return fig;}));
      box.append(row);s.append(box);
    }
    return s;}));
  draw();
}

function draw(){
  if(!data)return;const z=+$('zoom').value;
  document.querySelectorAll('#units canvas').forEach(c=>{
    const {unit:id,anim,dir}=c.dataset,u=data.units[id],a=u.anims[anim],st=states[id+'/'+anim];
    const [w,h]=u.cell,[px,py]=u.pivot,r=u.rows.indexOf(dir),im=images[a.image];
    if(c.width!==w*z||c.height!==h*z){c.width=w*z;c.height=h*z;}
    const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
    ctx.fillStyle=BG;ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#0003';ctx.fillRect((px-3)*z,py*z,7*z,z);
    if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,st.frame*w,r*h,w,h,0,0,w*z,h*z);
    c.nextSibling.textContent=dir+' · '+(st.frame+1)+'/'+a.frames;
  });
}

function tick(now){
  const dt=Math.min(250,now-last)*speed;last=now;
  if(playing&&data){let changed=false;
    for(const [key,st] of Object.entries(states)){const [id,name]=key.split('/'),a=data.units[id].anims[name];st.elapsed+=dt;
      for(;;){const end=!a.loop&&st.frame===a.frames-1,ms=a.ms[st.frame]+(end?HOLD:0);
        if(st.elapsed<ms)break;st.elapsed-=ms;st.frame=(st.frame+1)%a.frames;changed=true;}}
    if(changed)draw();}
  requestAnimationFrame(tick);
}

function header(){
  if(!data)return;
  $('elapsed').textContent=clock(Date.now()/1000-data.started);
  $('count').textContent=`${data.changed}/${data.total}`;$('bar').style.width=(100*data.changed/Math.max(1,data.total)).toFixed(1)+'%';
  $('eta').textContent=data.eta==null?'계산 중':'약 '+clock(data.eta);
  $('updated').textContent=hm(data.updated)+' · '+ago(Date.now()/1000-data.updated);
}

async function poll(){
  try{const r=await fetch('heroes/live/status.json?t='+Date.now());if(!r.ok)throw Error('heroes/live/status.json 없음 · heroes/tools 에서 live.py 를 실행하세요.');
    const d=await r.json();
    if(!data||d.updated!==data.updated){await loadImages(d);data=d;layout();}
    header();status(Date.now()/1000-data.updated>120?'live.py 갱신이 멈춘 듯합니다':'',Date.now()/1000-data.updated>120);
  }catch(e){status(e.message,true);}
}

$('zoom').onchange=draw;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ 정지':'▶ 재생';};
$('speeds').onclick=e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.speed;
  $('speeds').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));};
poll();setInterval(poll,10000);setInterval(header,1000);requestAnimationFrame(tick);
</script>
</body></html>
