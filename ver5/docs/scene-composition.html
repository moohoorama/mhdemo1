<head>
<meta charset="utf-8">

<title>장면과 전투맵의 화면 구성</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #251f19; background: #f5f2e9; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1050px; margin: auto; padding: clamp(22px, 5vw, 62px) clamp(16px, 4vw, 42px); }
  h1, h2, p, figure { margin: 0; }
  h1 { font-size: clamp(30px, 4.6vw, 49px); letter-spacing: -.06em; line-height: 1.15; }
  h2 { font-size: 21px; letter-spacing: -.04em; }
  p, li { line-height: 1.62; }
  .lead { margin-top: 12px; color: #51473d; }
  .scene { margin-top: 28px; }
  .heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .shot { position: relative; overflow: hidden; border-radius: 10px; background: #441b0d; }
  img { display: block; width: 100%; height: auto; }
  .badge { display: inline-grid; place-items: center; min-width: 21px; height: 21px; padding: 0 4px; border-radius: 50%; background: #f6ddb0; color: #332415; font-size: 12px; font-weight: 800; }
  .shot .badge { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); box-shadow: 0 0 0 2px #211811; }
  .scene-marker { border-radius: 6px; padding-inline: 7px; white-space: nowrap; }
  .legend { margin: 10px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
  .legend li { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
  .legend .badge { flex: none; align-self: start; margin-top: 2px; }
  .note, footer, .capture { font-size: 13px; color: #625448; }
  .capture { margin-top: 7px; }
  .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 25px; align-items: start; }
  .card { padding: 15px; border: 1px solid #ddd2c1; border-radius: 12px; background: #fffdf7; }
  .card h2 { margin-bottom: 9px; }
  .card .legend { grid-template-columns: 1fr; }
  .note { margin-top: 12px; }
  code { font-size: .95em; }
  footer { margin-top: 19px; }
  a { color: #62442b; text-underline-offset: 3px; }
  @media (max-width: 680px) { .bottom, .legend { grid-template-columns: 1fr; } }
</style>

    <section class="card" aria-labelledby="order-title">
      <h2 id="order-title">기존 3번과 4번의 색이 갈린 이유</h2>
      <p class="note">기존 3번과 4번은 같은 배경을 보고 있었습니다. 3번은 장면 캔버스 안이라 배경 위에 노을 색이 한 번 더 얹혔고, 4번은 캔버스 밖이라 배경색이 그대로 보였습니다.</p>
      <p class="note">지금은 화면 전체에 단색 배경을 한 번 깔고, 노을 효과는 그 위에 올라가는 맵과 인물에만 적용합니다.</p>
