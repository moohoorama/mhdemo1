057"]}], "intro": "# 삼국지 SRPG 특성·병법·책략 정리안\n\n## 표와 전투 판정의 기준\n\n- 병종별·인물별 특성 표는 해당 병종·인물이 **학습할 수 있는 특성 목록**이다. 자동 보유 목록이 아니다. 장비 특성은 장착한 동안 부여된다.\n- 특성 목록의 `학습 가능 병종·인물`은 2·3절에 직접 배정한 대상을 적는다. 상위 병종이 이어받는 하위 병종의 학습 풀은 중복해서 적지 않는다. `미배정`은 학습처를 아직 정하지 않았다는 뜻이다.\n- 선행은 각 특성의 `선행` 칸을 기준으로 하며, 현행 엔진의 선행을 자동으로 승계하지 않는다. 선행 관계는 추가 정리한다.\n- 보병·창병·근접 기병의 공격은 사거리가 늘어나도 근접 판정이다. 창병이 2칸 떨어진 적을 찌르는 공격도 근접이다. 궁병·궁기병의 사격과 `기사`로 하는 사격은 원거리 판정이다. 거리만으로 근접·원거리를 바꾸지 않도록 사거리·공격 모드 처리를 수정한다.\n- 주변 피해는 사방격·팔방격·찔러공격처럼 적 1기를 공격했을 때 주변·뒤 칸의 적에게 함께 들어가는 피해다. 기본 비율 50%는 상한이 아니다. 위압의 +30%p가 더해지면 80%가 된다.\n- 특성은 조건과 규칙을 우선한다. 수치 보정도 독행의 고립, 일당백의 주변 적 수, 돌진의 이동 거리처럼 전술적 조건이 핵심이면 사용한다.\n\n### 발동 방식과 분류\n\n배우는 것은 특성이며, 배운 뒤 자동으로 적용되는 효과와 직접 선택해서 쓰는 기술을 구분한다. 화계처럼 여러 기술을 여는 학습 특성은 특정 공격 한 번과 구분한다. 아래 분류는 새 특성안의 설계 기준이며, 엔진·게임 데이터에는 아직 적용하지 않았다.\n\n- `자동`: 행동으로 선택하지 않는다. 상시 보정·면역뿐 아니라 턴 시작·명중·퇴각 등 조건에 따라 자동으로 발동하는 특기도 포함한다.\n- `사용`: 행동으로 기술을 직접 선택한다. 병법치 소모·성공률·사거리·지속시간은 해당 기술에서 정한다.\n- `계통 해금`: 해당 계통의 사용 기술들을 연다. 예를 들어 화계를 배우면 초열 등의 공격 책략을 쓴다. 화계강화·확산도 자동 피해 보정이 아니라 상위·범위 기술을 여는 학습 특성이다.\n\n| 분류 | 역할 | 엔진의 기존 구분 | 예 |\n|---|---|---|---|\n| 특기 | 행동 소모 없이 전투 규칙·수치를 바꾸거나 조건에 따라 자동 발동 | `Trait.Kind: talent`, `Trait.Effects` | 필살·간파·일당백·금쇄 |\n| 공격 병법 | 물리 공격으로 피해를 주는 사용 기술 | `Skill.Kind: physical` | 찌르기·난사·조준·화시 |\n| 공격 책략 | 책략 피해를 주는 사용 기술 | `Skill.Kind: magic` | 화계·수계·지계가 여는 기술 |\n| 방해 책략 | 적의 능력치를 낮추거나 상태이상·행동 봉쇄를 거는 사용 기술 | `Skill.Kind: status` | 교란·도발·질타·참언 |\n| 강화 책략 | 자신·아군의 능력치나 공격 규칙을 강화하는 사용 기술 | `Skill.Kind: buff` | 대비·반격술·기합·휘기 |\n| 회복 책략 | 병력·병법치 회복 또는 상태이상 해제 기술 | `Skill.Kind: heal` | 응급처치·구휼이 여는 기술 |\n| 복합 책략 | 아군 강화와 적 약화 등 다른 종류의 효과를 한 번에 적용 | 현행 단일 `Skill.Kind`·`Effect`만으로는 표현을 확장해야 함 | 새 팔진도 |\n\n`Trait.Kind`는 특기·전법·책략의 표시 분류이고, `Skill.Kind`는 사용 기술의 처리 종류다. `Tone`은 효과 분야의 색이며 발동 방식을 뜻하지 않는다. 근접·원거리는 별도 공격 모드다. 자기 강화·회복 기술도 기존 표시에서는 책략(`strategy`)에 속한다.\n\n질타는 적을 대상으로 직접 사용하는 **방해 책략**이다. 공격할 때 자동으로 봉쇄를 거는 특기가 아니며, 현재 안에는 병력 피해가 없다. 교란도 방해 책략이고, 새 도발은 사기 저하이므로 현행의 피해를 주는 공격 병법에서 방해 책략으로 바뀐다. 화시는 책략 피해가 섞여도 공격 병법이며, 조준은 강화만 거는 기술이 아니라 그 자리에서 쏘는 공격 병법이다.\n\n1절은 자동 특기·공격 병법·공격 책략·방해 책략·강화 책략·회복 책략·복합 책략 순서로 묶는다. 자동 특기 안에서는 효과 분야를 다시 나눈다. 예를 들어 금쇄는 자동 특기에, 휘기는 직접 사용하는 강화 책략에 둔다.", "notes": "- 용장은 필살로 통합한다. 전차대·관우·여포가 필살을 학습할 수 있다.\n- 투신은 삭제한다. 장비에게 줄 대체 특성은 미정이며, 사거리와 무관한 확정 반격으로 바꾸지 않는다.\n- 간파는 능력치 비교 없이 적의 공격·상태이상·디버프 책략을 막는다. 일반 병종에 배포하지 않고 소수 인물만 학습한다. 아군의 회복·강화 책략은 막지 않는다.\n- 회유는 확정 퇴각으로 바꾸지 않고 삭제한다. 마량의 고유 특성은 미정이다.\n- 허실·심모·질타의 능력치 비교 조건은 아직 검토 중이다. 아래는 현재 문구이며, 확정 효과로 변경한 것이 아니다.\n\n| 비교 능력치 | 특성 | 현재 조건과 효과 | 학습 가능 인물 |\n|---|---|---|---|\n| 지력 | 허실 | 자신보다 지력이 낮은 대상에게 모든 책략이 반드시 성공 | 제갈량 |\n| 지력 | 심모 | 자신보다 지력이 낮은 대상에게 책략이 성공하면 반드시 치명타 | 제갈량 |\n| 매력 | 질타 | 인접 적 1기의 공격 봉쇄. 대상의 매력이 자신보다 낮으면 반드시 성공 | 손부인 |\n\n장비의 대체 특성 후보: **일갈(가칭)** — 직접 사용하는 방해 책략. 자신을 중심으로 십자 5칸의 적에게 2턴 동안 공격력 저하를 건다. 반격을 늘리는 대신 적진에 들어가 주변 적의 공격을 꺾는 역할이다. 아직 채택하지 않은 제안이며, 특성 목록과 장비의 학습 풀에는 넣지 않았다."}</script>

   if(typeof t.id!=='string'||!t.id||ids.has(t.id))throw Error('특성 ID가 중복되거나 비어 있습니다.');ids.add(t.id);
   if(typeof t.name!=='string'||!t.name.trim()||names.has(t.name.trim()))throw Error('특성 이름이 비었거나 중복됩니다: '+(t.name||''));names.add(t.name.trim());
   if(!kinds.includes(t.kind)||!activations.includes(t.activation)||typeof t.description!=='string'||typeof t.area!=='string'||!Array.isArray(t.requires)||!Array.isArray(t.equipment)||t.equipment.some(x=>typeof x!=='string'))throw Error('특성의 분류·설명·선행 형식이 올바르지 않습니다.');
   if((t.kind==='특기')!==(t.activation==='자동'))throw Error(t.name+': 특기는 자동, 병법·책략은 사용 또는 계통 해금으로 분류해 주세요.');
   if(t.requires.length!==new Set(t.requires).size)throw Error(t.name+': 선행이 중복되었습니다.');
  }
  for(const t of d.traits)for(const id of t.requires)if(!ids.has(id))throw Error(t.name+': 존재하지 않는 선행 특성입니다.');
  const marks=new Map();
  function visit(id,path){if(marks.get(id)===1)throw Error('선행이 순환합니다: '+[...path,id].map(x=>trait(d,x).name).join(' → '));if(marks.get(id)===2)return;marks.set(id,1);for(const r of trait(d,id).requires)visit(r,[...path,id]);marks.set(id,2);}
  for(const t of d.traits)visit(t.id,[]);
  for(const o of d.owners){
   if(typeof o.id!=='string'||!o.id||ownerIds.has(o.id))throw Error('대상 ID가 중복되거나 비어 있습니다.');ownerIds.add(o.id);
   if(!['class','officer'].includes(o.type)||typeof o.name!=='string'||!o.name.trim()||typeof o.group!=='string'||!Array.isArray(o.traits)||!Array.isArray(o.parents)||typeof o.classId!=='string')throw Error('병종·장수 정보가 올바르지 않습니다.');
   const key=o.type+':'+o.name.trim();if(ownerNames.has(key))throw Error('같은 이름의 대상이 있습니다: '+o.name);ownerNames.add(key);
   if(o.traits.length!==new Set(o.traits).size||o.traits.some(id=>!ids.has(id)))throw Error(o.name+': 학습 목록에 중복되거나 없는 특성이 있습니다.');
  }
  const classMarks=new Map();
  function classVisit(id){if(classMarks.get(id)===1)throw Error('병종 승급 경로가 순환합니다.');if(classMarks.get(id)===2)return;classMarks.set(id,1);const o=owner(d,id);for(const p of o.parents){if(owner(d,p)?.type!=='class')throw Error('존재하지 않는 하위 병종입니다.');classVisit(p);}classMarks.set(id,2);}
  for(const o of d.owners){if(o.classId&&owner(d,o.classId)?.type!=='class')throw Error(o.name+': 병종이 존재하지 않습니다.');if(o.type==='class')classVisit(o.id);}
  return d;
 }
 function ownersOf(d,id){return d.owners.filter(o=>o.traits.includes(id));}
 function rename(d,id,name,replaceText=true){
  const t=trait(d,id), next=name.trim();if(!t||!next)throw Error('특성 이름을 입력해 주세요.');if(d.traits.some(x=>x.id!==id&&x.name===next))throw Error('같은 이름의 특성이 있습니다.');
  const old=t.name;if(old===next)return;
  if(replaceText){const known=[...new Set([...d.traits.map(x=>x.name),...d.owners.map(x=>x.name)])].sort((a,b)=>b.length-a.length);const escape=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp(known.map(escape).join('|'),'g');const replace=s=>s.replace(re,n=>n===old?next:n);for(const x of d.traits)x.description=replace(x.description);d.intro=replace(d.intro);d.notes=replace(d.notes);}
  t.name=next;
 }
 function assign(d,ownerId,traitId,enabled){const o=owner(d,ownerId);if(!o||!trait(d,traitId))throw Error('대상 또는 특성을 찾을 수 없습니다.');o.traits=enabled?[...new Set([...o.traits,traitId])]:o.traits.filter(id=>id!==traitId);}
 function setRequires(d,id,requires){const t=trait(d,id);if(!t)throw Error('특성을 찾을 수 없습니다.');const previous=t.requires;t.requires=[...new Set(requires)];try{validate(d);}catch(e){t.requires=previous;throw e;}}
 function remove(d,id){d.traits=d.traits.filter(t=>t.id!==id);for(const t of d.traits)t.requires=t.requires.filter(r=>r!==id);for(const o of d.owners)o.traits=o.traits.filter(r=>r!==id);}
 function classChain(d,id){const result=[],seen=new Set();function walk(key){if(!key||seen.has(key))return;const o=owner(d,key);if(!o||o.type!=='class')return;seen.add(key);for(const p of o.parents)walk(p);result.push(o);}walk(id);return result;}
 function graph(d,ownerId,includeClass=true,classOverride){
  const o=owner(d,ownerId);if(!o)return{nodes:[],edges:[],classes:[]};
  const own=new Set(o.traits), inherited=new Set();const classes=o.type==='class'?classChain(d,o.id):includeClass?classChain(d,classOverride===undefined?o.classId:classOverride):[];
  for(const c of classes)for(const id of c.traits)inherited.add(id);
  const included=new Set();function add(id){if(included.has(id))return;included.add(id);for(const p of trait(d,id).requires)add(p);}for(const id of new Set([...own,...inherited]))add(id);
  const memo=new Map();function depth(id){if(memo.has(id))return memo.get(id);const ps=trait(d,id).requires;const n=ps.length?Math.max(...ps.map(depth))+1:0;memo.set(id,n);return n;}
  const nodes=d.traits.filter(t=>included.has(t.id)).map(t=>({id:t.id,name:t.name,kind:t.kind,description:t.description,depth:depth(t.id),source:o.type==='class'?(inherited.has(t.id)?'class':'missing'):own.has(t.id)?'own':inherited.has(t.id)?'class':'missing'}));
  const edges=nodes.flatMap(n=>trait(d,n.id).requires.map(from=>({from,to:n.id})));
  return{nodes,edges,classes:classes.map(c=>c.name)};
 }
 function markdown(d){
  const cell=s=>String(s).replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>');
  const row=c=>'| '+c.map(cell).join(' | ')+' |';
  const out=[d.intro.trim(),'','## 1. 분류별 특성 목록',''];
  for(const [index,kind]of kinds.entries()){
   const ts=d.traits.filter(t=>t.kind===kind);if(!ts.length)continue;out.push('### 1.'+(index+1)+' '+(kind==='특기'?'자동 특기':kind),'');
   const groups=kind==='특기'?[...new Set(ts.map(t=>t.area||'기타'))]:['계통 해금','사용','자동'].filter(a=>ts.some(t=>t.activation===a));
   for(const group of groups){const selected=ts.filter(t=>kind==='특기'?(t.area||'기타')===group:t.activation===group);if(groups.length>1)out.push('#### '+group,'');out.push(row(['특성','발동','분류','설명','선행','학습 가능 병종·인물','장비']),row(Array(7).fill('---')));
    for(const t of selected){const os=ownersOf(d,t.id);const source=['class','officer'].map(type=>{const ns=os.filter(o=>o.type===type).map(o=>o.name);return ns.length?(type==='class'?'병종: ':'인물: ')+ns.join(', '):'';}).filter(Boolean).join(' / ')||'미배정';out.push(row([t.name,t.activation,t.kind,t.description,t.requires.map(id=>trait(d,id).name).join(', '),source,t.equipment.join(', ')]));}out.push('');
   }
  }
  for(const [type,number,title]of [['class',2,'병종별 특성'],['officer',3,'인물별 특성']]){out.push('---','','## '+number+'. '+title,'');const os=d.owners.filter(o=>o.type===type);for(const group of new Set(os.map(o=>o.group||'기타'))){out.push('### '+group,'',row([type==='class'?'병종':'인물','특성']),row(['---','---']));for(const o of os.filter(o=>(o.group||'기타')===group))out.push(row([o.name,o.traits.map(id=>trait(d,id).name).join(', ')||'미정']));out.push('');}}
  out.push('---','','## 4. 특성 변경 결정과 남은 검토','',d.notes.trim(),'');return out.join('\n');
 }
 return {kinds,activations,clone,trait,owner,validate,ownersOf,rename,assign,setRequires,remove,classChain,graph,markdown};
})();

   '<div class="section-label"><strong>선행 특성</strong><span>여러 개면 모두 필요</span></div><div class="chips">'+(chips(t.requires,'remove-require','data-id')||'<span class="hint">선행 없음</span>')+'</div><input aria-label="선행 특성 검색" placeholder="선행으로 연결할 특성 검색" id="require-search" data-focus="require-search" value="'+esc(ui.requireSearch)+'"><div class="checklist">'+data.traits.filter(x=>x.id!==t.id&&(!reqQ||x.name.toLocaleLowerCase().includes(reqQ))).map(x=>'<label class="check-row"><input type="checkbox" data-focus="req-'+esc(x.id)+'" data-require="'+esc(x.id)+'"'+(t.requires.includes(x.id)?' checked':'')+'><span class="grow">'+esc(x.name)+'</span><small>'+esc(x.kind)+'</small></label>').join('')+'</div>'+
   '<div class="section-label"><strong>학습 가능한 병종·장수</strong><span>'+owners.length+'곳 · 양방향 연동</span></div><div class="chips">'+(owners.map(o=>'<span class="chip">'+esc(labelOwner(o))+'<button aria-label="'+esc(o.name)+' 배정 해제" data-action="unassign-owner" data-id="'+esc(o.id)+'">×</button></span>').join('')||'<span class="hint">미배정</span>')+'</div><input aria-label="학습 대상 검색" placeholder="병종·장수 이름 검색" id="assignment-search" data-focus="assignment-search" value="'+esc(ui.assignmentSearch)+'"><div class="checklist">'+data.owners.filter(o=>!ownerQ||[o.name,o.group].join(' ').toLocaleLowerCase().includes(ownerQ)).map(o=>'<label class="check-row"><input type="checkbox" data-focus="assign-'+esc(o.id)+'" data-assign-owner="'+esc(o.id)+'"'+(o.traits.includes(t.id)?' checked':'')+'><span class="grow">'+esc(o.name)+'</span><small>'+(o.type==='class'?'병종':'장수')+' · '+esc(o.group)+'</small></label>').join('')+'</div>'+
   '<div class="field" style="margin-top:22px"><label for="trait-equipment">부여 장비</label><input id="trait-equipment" data-trait-field="equipment" value="'+esc(t.equipment.join(', '))+'" placeholder="청룡언월도, ..."><p class="hint">쉼표로 구분합니다. 학습 배정과 별개입니다.</p></div><div class="saved-note">선행과 학습 배정은 고정 ID로 연결됩니다. 이름을 바꿔도 연결은 유지됩니다.</div>';
 }else{
  const o=selectedOwner();if(!o){$('detail').innerHTML='<div class="empty">병종·장수를 선택하세요.</div>';return;}
  const q=ui.poolSearch.toLocaleLowerCase();
  const chain=o.type==='class'?M.classChain(data,o.id).filter(x=>x.id!==o.id):M.classChain(data,o.classId);
  $('detail').innerHTML='<div class="detail-title"><div><h2>'+esc(o.name)+'</h2><p class="hint">직접 배정하는 고유 학습 목록입니다.</p></div><button class="small" data-action="show-tree" data-id="'+esc(o.id)+'">트리 보기 ↗</button></div>'+
   '<div class="field-pair"><div class="field"><label for="owner-name">'+(o.type==='class'?'병종':'장수')+' 이름</label><input id="owner-name" data-owner-field="name" value="'+esc(o.name)+'"></div><div class="field"><label for="owner-group">분류 / 진영</label><input id="owner-group" data-owner-field="group" value="'+esc(o.group)+'"></div></div>'+
   (o.type==='officer'?'<div class="field"><label for="owner-class">기본 병종</label><select id="owner-class" data-owner-field="classId">'+options([['','미정'],...data.owners.filter(x=>x.type==='class').map(x=>[x.id,x.name])],o.classId)+'</select><p class="hint">트리에서 병종을 바꿔 미리 볼 수 있습니다.</p></div>':'<p class="hint">승급 전 병종: '+esc(chain.map(x=>x.name).join(' → ')||'없음')+'</p>')+
   '<div class="section-label"><strong>고유 학습 특성</strong><span>'+o.traits.length+'개</span></div><div class="chips">'+(chips(o.traits,'remove-pool','data-id')||'<span class="hint">미정 / 배정 없음</span>')+'</div><input aria-label="배정할 특성 검색" placeholder="추가·제거할 특성 검색" id="pool-search" data-focus="pool-search" value="'+esc(ui.poolSearch)+'"><div class="checklist" style="max-height:380px">'+data.traits.filter(t=>!q||[t.name,t.kind].join(' ').toLocaleLowerCase().includes(q)).map(t=>'<label class="check-row"><input type="checkbox" data-focus="pool-'+esc(t.id)+'" data-pool="'+esc(t.id)+'"'+(o.traits.includes(t.id)?' checked':'')+'><span class="grow">'+esc(t.name)+'</span><small>'+esc(t.kind)+'</small></label>').join('')+'</div><div class="saved-note">여기서 배정을 바꾸면 특성의 학습 대상과 오른쪽 트리가 함께 바뀝니다.</div>'+
   (chain.length?'<div class="section-label"><strong>병종에서 이어받는 학습 풀</strong></div><p class="hint">'+esc(chain.map(x=>x.name).join(' → '))+'</p><div class="chips">'+[...new Set(chain.flatMap(x=>x.traits))].map(id=>'<span class="chip">'+esc(M.trait(data,id).name)+'</span>').join('')+'</div>':'');
 }
}
function renderTreeControls(){
 if(!M.owner(data,ui.treeOwner))ui.treeOwner=data.owners[0]?.id||'';
 const o=M.owner(data,ui.treeOwner);$('tree-owner').innerHTML=['officer','class'].map(type=>'<optgroup label="'+(type==='officer'?'장수':'병종')+'">'+options(data.owners.filter(x=>x.type===type).map(x=>[x.id,x.name]),ui.treeOwner)+'</optgroup>').join('');
 const preview=ui.treeClasses[ui.treeOwner]===undefined?o?.classId||'':ui.treeClasses[ui.treeOwner];$('tree-class').innerHTML=options([['','병종 미정 / 고유 특성만'],...data.owners.filter(x=>x.type==='class').map(x=>[x.id,x.name+' 학습 풀'])],preview);$('tree-class').disabled=!o||o.type==='class'||!ui.includeClass;$('include-class').checked=ui.includeClass;$('include-class').disabled=o?.type==='class';$('tree-title').textContent=(o?.name||'선택한 대상')+'의 학습 트리';
}
let graphSize={width:600,height:400};
function renderGraph(){
 const o=M.owner(data,ui.treeOwner), g=M.graph(data,ui.treeOwner,ui.includeClass,ui.treeClasses[ui.treeOwner]);
 if(!g.nodes.length){$('graph').innerHTML='<div class="empty" style="padding-top:100px">아직 학습 특성이 없습니다.<br>병종·장수 화면에서 특성을 배정해 보세요.</div>';$('tree-notice').innerHTML='';$('tree-summary').textContent='노드를 누르면 해당 특성을 편집합니다.';return;}
 const layers=[];for(const n of g.nodes)(layers[n.depth]??=[]).push(n);
 const positions=new Map(),nodeWidth=174,nodeHeight=65,xGap=68,yGap=25,pad=28;
 const maxRows=Math.max(...layers.map(x=>x?.length||0));const width=pad*2+layers.length*nodeWidth+(layers.length-1)*xGap,height=pad*2+maxRows*nodeHeight+(maxRows-1)*yGap;
 for(let depth=0;depth<layers.length;depth++){const layer=layers[depth]||[];if(depth){layer.sort((a,b)=>{const mean=n=>{const ps=M.trait(data,n.id).requires.map(id=>positions.get(id)?.y||0);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0;};return mean(a)-mean(b);});}const offset=(height-(layer.length*nodeHeight+(layer.length-1)*yGap))/2;layer.forEach((n,i)=>positions.set(n.id,{x:pad+depth*(nodeWidth+xGap),y:offset+i*(nodeHeight+yGap)}));}
 let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+width*ui.zoom/100+'" height="'+height*ui.zoom/100+'" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+esc(o?.name)+'의 특성 선행 트리"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#98a68f" stroke-width="1.4"/></marker></defs>';
 for(const edge of g.edges){const a=positions.get(edge.from),b=positions.get(edge.to),x1=a.x+nodeWidth,y1=a.y+nodeHeight/2,x2=b.x-3,y2=b.y+nodeHeight/2;svg+='<path d="M '+x1+' '+y1+' C '+(x1+xGap/2)+' '+y1+', '+(x2-xGap/2)+' '+y2+', '+x2+' '+y2+'" fill="none" stroke="#aeb9a4" stroke-width="1.4" marker-end="url(#arrow)"/>';}
 for(const n of g.nodes){const p=positions.get(n.id),colors=n.source==='own'?['#f0f3fa','#9aaed1','#526b96']:n.source==='class'?['#edf4e9','#9ab391','#406344']:['#fff4df','#c39650','#9b6d2d'];const active=n.id===ui.traitId;svg+='<g role="button" tabindex="0" data-action="node" data-id="'+esc(n.id)+'" aria-label="'+esc(n.name)+' 편집"><title>'+esc(n.name+' · '+n.description)+'</title><rect x="'+p.x+'" y="'+p.y+'" width="'+nodeWidth+'" height="'+nodeHeight+'" rx="8" fill="'+colors[0]+'" stroke="'+(active?'#285e4c':colors[1])+'" stroke-width="'+(active?'2.2':'1.1')+'"'+(n.source==='missing'?' stroke-dasharray="4 3"':'')+'/><text x="'+(p.x+13)+'" y="'+(p.y+26)+'" fill="#2c3c31" font-size="'+(n.name.length>12?'11':'13')+'" font-weight="650">'+esc(n.name.length>17?n.name.slice(0,16)+'…':n.name)+'</text><text x="'+(p.x+13)+'" y="'+(p.y+47)+'" fill="'+colors[2]+'" font-size="10">'+esc(n.source==='own'?'고유 학습':n.source==='class'?'병종 학습':'선행 · 학습처 없음')+' · '+esc(n.kind)+'</text></g>';}
 svg+='</svg>';$('graph').innerHTML=svg;graphSize={width,height};$('zoom').value=ui.zoom;$('zoom-value').textContent=ui.zoom+'%';
 const missing=g.nodes.filter(n=>n.source==='missing');$('tree-notice').innerHTML=missing.length?'<div class="tree-notice">학습 경로 확인: '+esc(missing.map(n=>n.name).join(', '))+' — 선행으로 필요하지만 현재 고유·병종 학습 풀에는 없습니다.</div>':'';
 $('tree-summary').textContent=g.nodes.length+'개 특성 · '+g.edges.length+'개 선행 연결'+(g.classes.length?' / '+g.classes.join(' → '):'')+' · 노드를 눌러 편집';
}
function renderNotes(){
 $('notes-panel').innerHTML='<h2>원문과 검토 메모</h2><p class="hint">Markdown으로 내보낼 때 특성·학습 표는 현재 편집 내용으로 새로 만듭니다. 안내·검토 문구는 아래 원문을 사용합니다.</p><div class="field" style="margin-top:22px;max-width:520px"><label for="draft-title">수정안 파일 제목</label><input id="draft-title" data-note-field="title" value="'+esc(data.title)+'"></div><div class="notes-columns"><div class="field"><label for="intro-notes">문서 머리말 / 전투 판정 기준</label><textarea id="intro-notes" data-note-field="intro" rows="22">'+esc(data.intro)+'</textarea></div><div class="field"><label for="decision-notes">변경 결정 / 남은 검토</label><textarea id="decision-notes" data-note-field="notes" rows="22">'+esc(data.notes)+'</textarea></div></div><p class="hint">메모는 자유로운 초안입니다. 특성 이름 변경 시 본문 치환을 켜 두면 함께 갱신됩니다.</p>';
}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function fileName(suffix){return(data.title||'특성 수정안').replace(/[\\/:*?"<>|]/g,'_')+suffix;}
function htmlSnapshot(){const doc=document.documentElement.cloneNode(true);const embedded=M.clone(data);embedded.storageId=uniqueId('srpg-trait-draft-');doc.querySelector('#seed-data').textContent=JSON.stringify(embedded).replace(/</g,'\\u003c');doc.querySelector('#toast').classList.remove('show');return'<!doctype html>\n'+doc.outerHTML;}
function actions(action,id,value){
 if(action==='tab'){ui.tab=value;ui.search='';render();return;}
 if(action==='select-trait'||action==='node'){ui.traitId=id;ui.tab='traits';ui.requireSearch='';ui.assignmentSearch='';render();return;}
 if(action==='select-owner'){ui.ownerId=id;ui.treeOwner=id;ui.poolSearch='';render();return;}
 if(action==='show-tree'){ui.treeOwner=id;renderTreeControls();renderGraph();return;}
 if(action==='undo'){if(!undo.length)return;redo.push(M.clone(data));data=undo.pop();persist();render();return;}
 if(action==='redo'){if(!redo.length)return;undo.push(M.clone(data));data=redo.pop();persist();render();return;}
 if(action==='remove-require'){const t=selectedTrait();commit(d=>M.setRequires(d,t.id,t.requires.filter(x=>x!==id)),'선행 제거');return;}
 if(action==='unassign-owner'){commit(d=>M.assign(d,id,ui.traitId,false),'학습 배정 해제');return;}
 if(action==='remove-pool'){commit(d=>M.assign(d,ui.ownerId,id,false),'학습 배정 해제');return;}
 if(action==='add-trait'){const id=uniqueId('t');let name='새 특성',n=2;while(data.traits.some(t=>t.name===name))name='새 특성 '+n++;ui.traitId=id;ui.search='';ui.kind='';ui.unassigned=false;commit(d=>d.traits.push({id,name,description:'',kind:'특기',activation:'자동',area:'기타',requires:[],equipment:[]}),'특성 추가');$('trait-name')?.focus();return;}
 if(action==='add-owner'){const name=prompt('추가할 '+(ui.ownerType==='class'?'병종':'장수')+' 이름');if(!name?.trim())return;const id=uniqueId('o'),type=ui.ownerType==='class'?'class':'officer';ui.ownerId=id;ui.treeOwner=id;ui.search='';commit(d=>d.owners.push({id,type,name:name.trim(),group:type==='class'?'기타':'추가 장수',traits:[],parents:[],classId:''}),'대상 추가');return;}
 if(action==='delete-trait'){const t=selectedTrait();if(!t)return;const refs=data.traits.filter(x=>x.requires.includes(t.id));const count=M.ownersOf(data,t.id).length;if(!confirm('「'+t.name+'」을 삭제할까요?\n학습 대상 '+count+'곳과 선행 연결 '+refs.length+'곳에서도 제거합니다. 설명·메모의 문구는 그대로 남습니다.'))return;commit(d=>M.remove(d,t.id),'특성 삭제');ui.traitId=data.traits[0]?.id;render();return;}
 if(action==='fit'){const rect=$('graph').getBoundingClientRect();ui.zoom=Math.max(35,Math.min(150,Math.floor(Math.min((rect.width-20)/graphSize.width,(rect.height-20)/graphSize.height)*100)));renderGraph();return;}
 if(action==='markdown'){download(fileName('.md'),M.markdown(data),'text/markdown;charset=utf-8');toast('현재 편집 내용으로 Markdown을 내보냈습니다.');return;}
 if(action==='json'){download(fileName('.json'),JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('수정안 JSON을 저장했습니다.');return;}
 if(action==='html'){download(fileName('.html'),htmlSnapshot(),'text/html;charset=utf-8');toast('수정안이 포함된 HTML을 저장했습니다.');return;}
 if(action==='import'){$('file-input').click();return;}
 if(action==='reset'){if(!confirm('이 HTML에 들어 있던 원안으로 되돌릴까요? 실행 취소로 복원할 수 있습니다.'))return;commit(d=>{for(const key of Object.keys(d))delete d[key];Object.assign(d,M.clone(seed));},'원안 복원');return;}
}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled)return;actions(target.dataset.action,target.dataset.id,target.dataset.value);});
document.addEventListener('keydown',event=>{
 if(event.target.closest('g[role=button]')&&['Enter',' '].includes(event.key)){event.preventDefault();actions('node',event.target.closest('g[role=button]').dataset.id);return;}
 if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='z'&&!event.target.matches('input,textarea,[contenteditable=true]')){event.preventDefault();actions(event.shiftKey?'redo':'undo');}
});
document.addEventListener('input',event=>{const el=event.target;const fields={search:'search','require-search':'requireSearch','assignment-search':'assignmentSearch','pool-search':'poolSearch'};if(fields[el.id]){ui[fields[el.id]]=el.value;if(el.id==='search')renderList();else{const focus=rememberFocus();renderDetail();const next=[...document.querySelectorAll('[data-focus]')].find(x=>x.dataset.focus===focus?.key);next?.focus();next?.setSelectionRange(focus.start,focus.end);}return;}if(el.id==='zoom'){ui.zoom=Number(el.value);renderGraph();}});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='replace-mentions'){ui.replaceMentions=el.checked;return;}
 if(el.id==='list-filter'){if(ui.tab==='traits')ui.kind=el.value;else ui.ownerType=el.value;renderList();return;}
 if(el.id==='unassigned'){ui.unassigned=el.checked;renderList();return;}
 if(el.id==='tree-owner'){ui.treeOwner=el.value;renderTreeControls();renderGraph();return;}
 if(el.id==='tree-class'){ui.treeClasses[ui.treeOwner]=el.value;renderGraph();return;}
 if(el.id==='include-class'){ui.includeClass=el.checked;renderTreeControls();renderGraph();return;}
 if(el.dataset.traitField){const field=el.dataset.traitField,value=el.value;commit(d=>{const t=M.trait(d,ui.traitId);if(field==='name')M.rename(d,t.id,value,ui.replaceMentions);else if(field==='equipment')t.equipment=[...new Set(value.split(',').map(s=>s.trim()).filter(Boolean))];else{t[field]=value;if(field==='kind'){if(value==='특기')t.activation='자동';else if(t.activation==='자동')t.activation='사용';}}},'특성 수정',false);return;}
 if(el.dataset.ownerField){const field=el.dataset.ownerField;commit(d=>{const o=M.owner(d,ui.ownerId);o[field]=el.value.trim();},'대상 수정',false);return;}
 if(el.dataset.noteField){const field=el.dataset.noteField;commit(d=>{d[field]=el.value;},'메모 수정',false);return;}
 if(el.dataset.require){const t=selectedTrait(),r=el.dataset.require;commit(d=>M.setRequires(d,t.id,el.checked?[...t.requires,r]:t.requires.filter(x=>x!==r)),'선행 변경');return;}
 if(el.dataset.assignOwner){commit(d=>M.assign(d,el.dataset.assignOwner,ui.traitId,el.checked),'학습 대상 변경');return;}
 if(el.dataset.pool){commit(d=>M.assign(d,ui.ownerId,el.dataset.pool,el.checked),'학습 특성 변경');return;}
});
$('file-input').addEventListener('change',async event=>{const file=event.target.files[0];if(!file||importPending)return;importPending=true;try{if(file.size>12*1024*1024)throw Error('12MB 이하의 수정안 JSON을 선택해 주세요.');const next=JSON.parse(await file.text());M.validate(next);if(!confirm('현재 수정안을 불러온 JSON으로 바꿀까요? 실행 취소로 복원할 수 있습니다.'))return;undo.push(M.clone(data));redo=[];data=M.clone(next);ui.traitId=data.traits[0]?.id;ui.ownerId=data.owners[0]?.id;ui.treeOwner=data.owners.find(o=>o.type==='officer')?.id;ui.treeClasses={};ui.search='';persist();render();toast('수정안 JSON을 불러왔습니다.');}catch(error){toast('불러오지 못했습니다: '+error.message,true);}finally{importPending=false;event.target.value='';}});
try{const saved=localStorage.getItem(storageKey);if(saved){const restored=JSON.parse(saved);M.validate(restored);data=restored;}}catch(error){storageOK=false;setTimeout(()=>toast('자동 저장을 복원하지 못했습니다. 이 HTML의 원안을 열었습니다.',true),300);}
M.validate(data);render();
window.TraitEditor={getData:()=>M.clone(data),getGraph:()=>M.graph(data,ui.treeOwner,ui.includeClass,ui.treeClasses[ui.treeOwner]),toMarkdown:()=>M.markdown(data),toHTML:htmlSnapshot};
})();
</script>
