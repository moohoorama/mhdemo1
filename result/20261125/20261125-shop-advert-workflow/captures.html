<!doctype html><html lang=ko><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>새 상품 점원 전후 캡처</title><style>
:root{--bg:#f6f1e6;--fg:#2b2418;--card:#fffaf0;--line:#d8cdb4;--acc:#8a3b1e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1913;--fg:#eee5d0;--card:#26221a;--line:#4a4333;--acc:#e7a37e}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.6 'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
h1{font-size:20px}h2{font-size:17px;margin:22px 0 6px}h3{font-size:14px;margin:10px 0 4px;color:var(--acc)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px}
img{width:100%;height:auto;display:block}figcaption{font-size:13px;margin-top:4px}
</style><h1>새 상품 점원: 수정 전후 게임 캡처</h1><p>_uidemo-vm 탐험 데모(실제 게임 화면). 수정 전은 HEAD 데이터를 `-root`로 가리켜 같은 방식으로 찍었다. 대화 상자의 글은 데모가 자동으로 넘겨 일부만 보이는 프레임도 있다.</p><h2>03 낙양 술집 (콩·보리·술·특급주)</h2><h3>수정 전</h3><div class=g><figure><img src="captures/before-03-door.png" loading=lazy><figcaption>수정 전: 문 앞 야외에는 아무도 없음</figcaption></figure><figure><img src="captures/before-03-inside.png" loading=lazy><figcaption>수정 전: 가게 안에서 점원#1이 외침 (말을 걸어도 말이 없음)</figcaption></figure></div><h3>수정 후</h3><div class=g><figure><img src="captures/after-03-bubble.png" loading=lazy><figcaption>수정 후: 문 앞 점원이 말풍선으로 외침</figcaption></figure><figure><img src="captures/after-03-talk.png" loading=lazy><figcaption>수정 후: 말을 걸면 특급주 설명 (값 포함)</figcaption></figure></div><h2>08 평원 도구점 (만능약)</h2><h3>수정 전</h3><div class=g><figure><img src="captures/before-08-door.png" loading=lazy><figcaption>수정 전: 문 앞에 점원 없음</figcaption></figure><figure><img src="captures/before-08-inside.png" loading=lazy><figcaption>수정 전: 가게 안 점원#1</figcaption></figure></div><h3>수정 후</h3><div class=g><figure><img src="captures/after-08-bubble.png" loading=lazy><figcaption>수정 후: 문 앞 점원 말풍선, 안내 판 빨강</figcaption></figure><figure><img src="captures/after-08-talk.png" loading=lazy><figcaption>수정 후: 말을 걸면 만능약 설명</figcaption></figure></div><h2>14 서주성 도구점·주점 (중급 인수·빼갈)</h2><h3>수정 전</h3><div class=g><figure><img src="captures/before-14-door.png" loading=lazy><figcaption>수정 전: 두 문 앞에 점원 없음</figcaption></figure><figure><img src="captures/before-14-inside.png" loading=lazy><figcaption>수정 전: 도구점 안 점원#1</figcaption></figure></div><h3>수정 후</h3><div class=g><figure><img src="captures/after-14-doors.png" loading=lazy><figcaption>수정 후: 두 문 앞 점원이 각각 외침, 두 판 모두 빨강</figcaption></figure><figure><img src="captures/after-14-tools-talk.png" loading=lazy><figcaption>수정 후: 도구점 점원에게 말 걸기 (중급 인수)</figcaption></figure><figure><img src="captures/after-14-tavern-talk.png" loading=lazy><figcaption>수정 후: 주점 점원에게 말 걸기 (빼갈)</figcaption></figure></div><h2>19 업 대장간 (철검·철창·대궁·가죽장갑·구리갑옷·가죽옷)</h2><h3>수정 전</h3><div class=g><figure><img src="captures/before-19-door.png" loading=lazy><figcaption>수정 전: 견습공은 있으나 3종만 외치고 설명이 없음</figcaption></figure><figure><img src="captures/before-19-inside.png" loading=lazy><figcaption>수정 전: 안쪽에도 광고 점원이 또 있음</figcaption></figure></div><h3>수정 후</h3><div class=g><figure><img src="captures/after-19-talk1.png" loading=lazy><figcaption>수정 후: 6종을 모두 외치고, 말을 걸면 물건마다 설명 (철창)</figcaption></figure><figure><img src="captures/after-19-talk2.png" loading=lazy><figcaption>수정 후: 대궁 설명</figcaption></figure></div></html>
